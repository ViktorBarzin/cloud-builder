# Cloud's builder: turns one commit of an App repo into an image on ghcr.
# Cloud dispatches it (src/reconciler/github.ts in the cloud repo) and reads
# the run back; nothing else starts it.
#
# cloud-builder-format: 2
# (scripts/publish-builder.sh tells runs of this workflow from runs of the
# first, plain one by that line, and deletes the old ones.)
#
# This repo is public, so anyone can read its run logs, run titles and
# artifacts. None of them holds a User's data in plain form:
# - the inputs are the build id (a UUID, the run title) and `job`, the build
#   sealed with age to this repo's secret CLOUD_JOB_KEY;
# - the log shows step names and one `cloud-failure: <code>` line; every
#   script that touches the build sends its output and its errors to a file
#   that is sealed to Cloud's log recipient and uploaded as
#   `log-<build id>-<job>`;
# - the source tree goes from `fetch` to `build` sealed to the job key.
# Values read from the job are masked before use, no expression puts one
# into a step's env, where the log would print it, and no value of the
# App's env is put in the environment of a process on this host.
#
# Job `fetch` checks out exactly `sha`. Only its fetch step sees a
# repository token. Job `build` builds the tree with the repo's Dockerfile
# or Railpack, with the App's plain env (never secrets): build arguments
# (`--build-arg NAME=value` and one CLOUD_BUILD_ENV) for a Dockerfile,
# BuildKit secrets from mode-600 files for Railpack. It builds with no
# registry credential on the host, then signs in with this repo's
# GITHUB_TOKEN and pushes `image:sha`.
#
# A failed run prints one `cloud-failure: <code>` line (and an annotation);
# Cloud reads it from the job log to tell the User what to do next.
name: build
run-name: build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Cloud's id for this build (a Deploy id)
        required: true
        type: string
      job:
        description: The build, sealed to CLOUD_JOB_KEY (age, base64)
        required: true
        type: string

permissions: {}

env:
  AGE_VERSION: 1.3.2
  AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Install age
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/age.tgz" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/age.tgz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP" age/age age/age-keygen
          rm -f "$RUNNER_TEMP/age.tgz"

      - name: Open the job
        id: open
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          INPUT_JOB: ${{ inputs.job }}
          CLOUD_JOB_KEY: ${{ secrets.CLOUD_JOB_KEY }}
        run: |
          set -uo pipefail
          umask 077
          exec 2>/dev/null
          refuse() {
            echo "cloud-failure: invalid_input"
            echo "::error title=Cloud::the build job was refused"
            rm -f "$RUNNER_TEMP/job.json"
            exit 1
          }
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$INPUT_BUILD_ID" =~ $uuid ]] || refuse
          [ -n "$CLOUD_JOB_KEY" ] || refuse
          job="$RUNNER_TEMP/job.json"
          printf '%s' "$INPUT_JOB" | base64 -d \
            | "$RUNNER_TEMP/age/age" -d -i <(printf '%s\n' "$CLOUD_JOB_KEY") > "$job" \
            || refuse
          "$RUNNER_TEMP/age/age-keygen" -y <(printf '%s\n' "$CLOUD_JOB_KEY") > "$RUNNER_TEMP/job-recipient" \
            || refuse
          unset CLOUD_JOB_KEY INPUT_JOB
          # Mask the values before any later step could print one; no step
          # prints them. Not masked: values under 4 characters and values in
          # the text this workflow prints itself, which would hide parts of
          # every line. The data is escaped as workflow commands need.
          public='cloud-failure: invalid_input fetch_failed no_build_plan build_failed timed_out ::error title=Cloud::the build job was refused the repo could not be read the build failed the push failed'
          jq -r --arg public "$public" '[.repo_url, .sha, .image, (.build_env // {} | .[])] | .[] | strings | (., split("\n")[]) | select(length >= 4) | select(. as $v | $public | contains($v) | not) | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | "::add-mask::" + .' "$job" || refuse
          field() { jq -r --arg k "$1" '.[$k] | if type == "string" then . else "" end' "$job"; }
          [ "$(jq -r '.v' "$job")" = "1" ] || refuse
          [ "$(field build_id)" = "$INPUT_BUILD_ID" ] || refuse
          sha="$(field sha)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || refuse
          image="$(field image)"
          image_re='^ghcr\.io/viktorbarzin/cloud-[a-z][a-z0-9-]{0,29}[a-z0-9]_[a-z][a-z0-9-]{0,29}[a-z0-9]$'
          [[ "$image" =~ $image_re ]] || refuse
          repo_url="$(field repo_url)"
          repo_re='^https://(([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63})/[A-Za-z0-9._~/-]+$'
          [[ "$repo_url" =~ $repo_re ]] || refuse
          host="${BASH_REMATCH[1]}"
          case "$(field source)" in
            public) ;;
            forgejo) [ "$host" = "forgejo.viktorbarzin.me" ] || refuse ;;
            github-owner) [ "$host" = "github.com" ] || refuse ;;
            *) refuse ;;
          esac
          [[ "$(field log_recipient)" =~ ^age1[02-9ac-hj-np-z]{58}$ ]] || refuse
          # Names only (\A and \z: jq's ^ and $ match at any line), string
          # values with no NUL (the loops below split on it), and none of the
          # names Cloud leaves out of the build (src/lib/build-env.ts in the
          # cloud repo).
          jq -e '(.build_env // {}) | type == "object" and all(to_entries[]; (.key | test("\\A[A-Za-z_][A-Za-z0-9_]*\\z")) and (.key | test("\\A(PATH|LD_.*|DOCKER_.*|BUILDX_.*|BUILDKIT_.*|HTTP_PROXY|HTTPS_PROXY|NO_PROXY|ALL_PROXY|NODE_OPTIONS|BUN_.*|RAILPACK_CONFIG_FILE)\\z"; "i") | not) and (.value | type == "string" and (explode | index(0)) == null))' "$job" >/dev/null || refuse
          echo "opened" > "$RUNNER_TEMP/opened"

      # Every value is read from job.json; nothing about the build goes into
      # an env block. Both tokens are here, so no expression picks one by
      # the job's source; the script keeps only the one the source names.
      - name: Fetch the commit
        id: fetch
        env:
          FORGEJO_READ_TOKEN: ${{ secrets.FORGEJO_READ_TOKEN }}
          GH_OWNER_READ_TOKEN: ${{ secrets.GH_OWNER_READ_TOKEN }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/fetch.log"
          exec 2>>"$log"
          job="$RUNNER_TEMP/job.json"
          REPO_URL="$(jq -r '.repo_url' "$job")"
          SHA="$(jq -r '.sha' "$job")"
          SOURCE="$(jq -r '.source' "$job")"
          REPO_HOST="${REPO_URL#https://}"
          REPO_HOST="${REPO_HOST%%/*}"
          case "$SOURCE" in
            forgejo) REPO_TOKEN="$FORGEJO_READ_TOKEN" ;;
            github-owner) REPO_TOKEN="$GH_OWNER_READ_TOKEN" ;;
            *) REPO_TOKEN="" ;;
          esac
          unset FORGEJO_READ_TOKEN GH_OWNER_READ_TOKEN
          fail() {
            echo "cloud: $1 (fetch_failed)" >> "$log"
            echo "cloud-failure: fetch_failed"
            echo "::error title=Cloud::the repo could not be read"
            exit 1
          }
          # No system or user git config: the runner's turns on the Git LFS
          # filter, which would send the header below to any lfs.url the
          # repo's .lfsconfig names. The repo's tree runs no filter at all.
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          export GIT_LFS_SKIP_SMUDGE=1 GIT_TERMINAL_PROMPT=0
          # The token goes to git through the environment only: never into
          # a file, an argument or the remote URL. The header is scoped to
          # the repo's host, which the job check tied to the token.
          if [ -n "$REPO_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)
            echo "::add-mask::$basic"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://$REPO_HOST/.extraHeader"
            export GIT_CONFIG_VALUE_0="Authorization: Basic $basic"
          fi
          unset REPO_TOKEN
          git_safe=(git -c protocol.allow=never -c protocol.https.allow=always
            -c http.followRedirects=false -c credential.helper=
            -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false)
          git init -q tree >> "$log"
          cd tree
          if "${git_safe[@]}" fetch -q --depth 1 --no-tags -- "$REPO_URL" "$SHA" >> "$log"; then
            # Every object is here: the checkout needs no network, so no token.
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          else
            # A server that refuses a sha in `want` still serves its branches.
            # The checkout then fetches blobs, with the host-scoped header.
            "${git_safe[@]}" fetch -q --no-tags --filter=blob:none -- "$REPO_URL" \
              '+refs/heads/*:refs/remotes/origin/*' >> "$log" || fail "the repo could not be read"
          fi
          "${git_safe[@]}" -c advice.detachedHead=false checkout -q --detach "$SHA" >> "$log" \
            || fail "commit $SHA is not in the repo"
          [ "$(git rev-parse HEAD)" = "$SHA" ] || fail "checked out the wrong commit"
          rm -rf .git
          cd ..
          tar -czf tree.tgz -C tree . >> "$log" || fail "the tree could not be packed"
          echo "cloud: fetched $SHA" >> "$log"

      - name: Seal the tree
        run: |
          set -euo pipefail
          exec 2>>"$RUNNER_TEMP/fetch.log"
          "$RUNNER_TEMP/age/age" -R "$RUNNER_TEMP/job-recipient" -o tree.tgz.age tree.tgz
          rm -rf tree tree.tgz

      - name: Upload the tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-${{ inputs.build_id }}
          path: tree.tgz.age
          retention-days: 1
          if-no-files-found: error

      # The User's output may print anything; a `cloud-failure:` line in it
      # is dropped, so only this workflow's own lines carry a code.
      - name: Seal the log
        if: always()
        run: |
          set -uo pipefail
          [ -f "$RUNNER_TEMP/opened" ] || exit 0
          touch "$RUNNER_TEMP/fetch.log"
          mkdir -p "$RUNNER_TEMP/log"
          jq -r '.log_recipient' "$RUNNER_TEMP/job.json" > "$RUNNER_TEMP/log-recipient"
          grep -v 'cloud-failure:' "$RUNNER_TEMP/fetch.log" | tail -c 1000000 \
            | "$RUNNER_TEMP/age/age" -R "$RUNNER_TEMP/log-recipient" -o "$RUNNER_TEMP/log/fetch.log.age"
          rm -f "$RUNNER_TEMP/fetch.log" "$RUNNER_TEMP/job.json"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-${{ inputs.build_id }}-fetch
          path: ${{ runner.temp }}/log/fetch.log.age
          retention-days: 3
          if-no-files-found: ignore

  build:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
    env:
      RAILPACK_VERSION: 0.43.0
      RAILPACK_SHA256: 248a8f60f36854aabed6124113631078a802de3461660855fc4de9c26065c1fb
      RAILPACK_FRONTEND: ghcr.io/railwayapp/railpack-frontend:v0.43.0@sha256:355ef61fae6f2551103cd8b10c710cb07167dd353d561f15c69b8d7ac1c676cc
      # The image `railpack prepare` runs in: alpine 3.22, by digest.
      RAILPACK_RUNNER: alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    steps:
      - name: Install age
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/age.tgz" \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  $RUNNER_TEMP/age.tgz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/age.tgz" -C "$RUNNER_TEMP" age/age age/age-keygen
          rm -f "$RUNNER_TEMP/age.tgz"

      - name: Download the tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-${{ inputs.build_id }}
          path: ${{ runner.temp }}/artifact

      - name: Open the job
        id: open
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          INPUT_JOB: ${{ inputs.job }}
          CLOUD_JOB_KEY: ${{ secrets.CLOUD_JOB_KEY }}
        run: |
          set -uo pipefail
          umask 077
          exec 2>/dev/null
          refuse() {
            echo "cloud-failure: invalid_input"
            echo "::error title=Cloud::the build job was refused"
            rm -f "$RUNNER_TEMP/job.json"
            exit 1
          }
          [ -n "$CLOUD_JOB_KEY" ] || refuse
          job="$RUNNER_TEMP/job.json"
          printf '%s' "$INPUT_JOB" | base64 -d \
            | "$RUNNER_TEMP/age/age" -d -i <(printf '%s\n' "$CLOUD_JOB_KEY") > "$job" \
            || refuse
          public='cloud-failure: invalid_input fetch_failed no_build_plan build_failed timed_out ::error title=Cloud::the build job was refused the repo could not be read the build failed the push failed'
          jq -r --arg public "$public" '[.repo_url, .sha, .image, (.build_env // {} | .[])] | .[] | strings | (., split("\n")[]) | select(length >= 4) | select(. as $v | $public | contains($v) | not) | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | "::add-mask::" + .' "$job" || refuse
          # The fetch job checked the job in full; this one the fields it uses.
          [ "$(jq -r '.build_id' "$job")" = "$INPUT_BUILD_ID" ] || refuse
          [[ "$(jq -r '.sha' "$job")" =~ ^[0-9a-f]{40}$ ]] || refuse
          image_re='^ghcr\.io/viktorbarzin/cloud-[a-z][a-z0-9-]{0,29}[a-z0-9]_[a-z][a-z0-9-]{0,29}[a-z0-9]$'
          [[ "$(jq -r '.image' "$job")" =~ $image_re ]] || refuse
          [[ "$(jq -r '.log_recipient' "$job")" =~ ^age1[02-9ac-hj-np-z]{58}$ ]] || refuse
          jq -e '(.build_env // {}) | type == "object" and all(to_entries[]; (.key | test("\\A[A-Za-z_][A-Za-z0-9_]*\\z")) and (.key | test("\\A(PATH|LD_.*|DOCKER_.*|BUILDX_.*|BUILDKIT_.*|HTTP_PROXY|HTTPS_PROXY|NO_PROXY|ALL_PROXY|NODE_OPTIONS|BUN_.*|RAILPACK_CONFIG_FILE)\\z"; "i") | not) and (.value | type == "string" and (explode | index(0)) == null))' "$job" >/dev/null || refuse
          mkdir tree
          "$RUNNER_TEMP/age/age" -d -i <(printf '%s\n' "$CLOUD_JOB_KEY") "$RUNNER_TEMP/artifact/tree.tgz.age" \
            | tar -xzf - -C tree 2>> "$RUNNER_TEMP/build.log" || refuse
          unset CLOUD_JOB_KEY INPUT_JOB
          rm -rf "$RUNNER_TEMP/artifact"
          # The build env, one mode-600 file per name, for Railpack's
          # BuildKit secrets; never the environment of a process here.
          mkdir -m 700 "$RUNNER_TEMP/build-env"
          while IFS= read -r -d '' key && IFS= read -r -d '' value; do
            printf '%s' "$value" > "$RUNNER_TEMP/build-env/$key"
          done < <(jq -j '(.build_env // {}) | to_entries[] | .key, "\u0000", .value, "\u0000"' "$job")
          echo "opened" > "$RUNNER_TEMP/opened"

      - name: Install Railpack
        run: |
          curl -fsSL -o "$RUNNER_TEMP/railpack.tgz" \
            "https://github.com/railwayapp/railpack/releases/download/v${RAILPACK_VERSION}/railpack-v${RAILPACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RAILPACK_SHA256}  $RUNNER_TEMP/railpack.tgz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/railpack.tgz" -C "$RUNNER_TEMP" railpack

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A link in the tree must stay in the tree: nothing on this host may
      # read a host file through it.
      - name: Check the tree
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          exec 2>>"$log"
          root="$(realpath tree)"
          bad=0
          while IFS= read -r -d '' link; do
            target="$(realpath -m -- "$link")"
            case "$target" in
              "$root" | "$root"/*) ;;
              *)
                echo "cloud: ${link#tree/} is a link out of the repo" >> "$log"
                bad=1
                ;;
            esac
          done < <(find tree -type l -print0)
          if [ "$bad" = 0 ]; then exit 0; fi
          echo "cloud: the build failed (build_failed)" >> "$log"
          echo "cloud-failure: build_failed"
          echo "::error title=Cloud::the build failed (build_failed)"
          exit 1

      # No registry credential is on the host until the image is built, and
      # Railpack reads the User's tree only inside a container that has the
      # tree read-only, Railpack itself and an empty plan directory: no host
      # file, credential or Docker socket. It gets the App's plain env as
      # names and values in its arguments; the build reads the values as
      # BuildKit secrets. It needs the network to fetch mise.
      - name: Plan the build
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          exec 2>>"$log"
          if [ -f tree/Dockerfile ]; then
            echo "cloud: building with the repo's Dockerfile" >> "$log"
            exit 0
          fi
          echo "cloud: no Dockerfile, building with Railpack ${RAILPACK_VERSION}" >> "$log"
          envs=()
          while IFS= read -r -d '' key && IFS= read -r -d '' value; do
            envs+=(--env "$key=$value")
          done < <(jq -j '(.build_env // {}) | to_entries[] | .key, "\u0000", .value, "\u0000"' "$RUNNER_TEMP/job.json")
          mkdir -m 700 "$RUNNER_TEMP/plan"
          status=0
          timeout --signal=TERM 3m docker run --rm --read-only \
            --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,size=512m -e HOME=/tmp \
            -v "$RUNNER_TEMP/railpack:/railpack:ro" \
            -v "$PWD/tree:/src:ro" \
            -v "$RUNNER_TEMP/plan:/out" \
            "$RAILPACK_RUNNER" /railpack prepare /src --plan-out /out/railpack-plan.json "${envs[@]}" \
            >> "$log" || status=$?
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 124 ]; then
            code=timed_out
          elif grep -q "could not determine how to build" "$log"; then
            code=no_build_plan
          else
            code=build_failed
          fi
          echo "cloud: the plan failed ($code)" >> "$log"
          echo "cloud-failure: $code"
          echo "::error title=Cloud::the build failed ($code)"
          exit 1

      # Plain env reaches the build; secrets never do. A Dockerfile gets
      # each variable as `--build-arg NAME=value` (used where it declares
      # `ARG NAME`) and all of them as CLOUD_BUILD_ENV: base64 of
      # `export NAME='value'` lines, for `eval` before the build command.
      # Railpack gets them as BuildKit secrets from the mode-600 files. The
      # image is loaded into the local Docker; the push comes after sign-in.
      - name: Build the image
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          exec 2>>"$log"
          job="$RUNNER_TEMP/job.json"
          tag="$(jq -r '.image' "$job"):$(jq -r '.sha' "$job")"
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          args=(--progress plain --provenance=false --load --tag "$tag"
            --label "org.opencontainers.image.source=$source_url")
          if [ -f tree/Dockerfile ]; then
            while IFS= read -r -d '' key && IFS= read -r -d '' value; do
              args+=(--build-arg "$key=$value")
            done < <(jq -j '(.build_env // {}) | to_entries[] | .key, "\u0000", .value, "\u0000"' "$job")
            exports="$(jq -r '(.build_env // {}) | to_entries[] | "export \(.key)=\(.value | @sh)"' "$job" | base64 -w0)"
            args+=(--build-arg "CLOUD_BUILD_ENV=$exports")
          else
            args+=(--build-arg "BUILDKIT_SYNTAX=$RAILPACK_FRONTEND"
              -f "$RUNNER_TEMP/plan/railpack-plan.json"
              --build-arg "secrets-hash=$(jq -cS '.build_env // {}' "$job" | sha256sum | cut -c1-64)")
            while IFS= read -r key; do
              args+=(--secret "id=$key,src=$RUNNER_TEMP/build-env/$key")
            done < <(jq -r '(.build_env // {}) | keys[]' "$job")
          fi
          status=0
          # Below the job's 20 minutes, so the log still says why.
          timeout --signal=TERM 15m docker buildx build "${args[@]}" tree >> "$log" || status=$?
          rm -rf "$RUNNER_TEMP/build-env"
          if [ "$status" -eq 0 ]; then
            echo "cloud: built $tag" >> "$log"
            exit 0
          fi
          if [ "$status" -eq 124 ]; then
            code=timed_out
          else
            code=build_failed
          fi
          echo "cloud: the build failed ($code)" >> "$log"
          echo "cloud-failure: $code"
          echo "::error title=Cloud::the build failed ($code)"
          exit 1

      - name: Sign in to ghcr
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null 2>&1

      # A failed push is not the User's fault: no code, so Cloud says the
      # builder stopped and to push again.
      - name: Push the image
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          exec 2>>"$log"
          job="$RUNNER_TEMP/job.json"
          tag="$(jq -r '.image' "$job"):$(jq -r '.sha' "$job")"
          if timeout --signal=TERM 5m docker push "$tag" >> "$log"; then
            echo "cloud: pushed $tag" >> "$log"
            exit 0
          fi
          echo "cloud: the push failed" >> "$log"
          echo "::error title=Cloud::the push failed"
          exit 1

      - name: Sign out of ghcr
        if: always()
        run: docker logout ghcr.io > /dev/null 2>&1

      - name: Seal the log
        if: always()
        run: |
          set -uo pipefail
          rm -rf "$RUNNER_TEMP/build-env"
          [ -f "$RUNNER_TEMP/opened" ] || exit 0
          touch "$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/log"
          jq -r '.log_recipient' "$RUNNER_TEMP/job.json" > "$RUNNER_TEMP/log-recipient"
          # The end of a very long log is what explains a failure.
          grep -v 'cloud-failure:' "$RUNNER_TEMP/build.log" | tail -c 4000000 \
            | "$RUNNER_TEMP/age/age" -R "$RUNNER_TEMP/log-recipient" -o "$RUNNER_TEMP/log/build.log.age"
          rm -f "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/job.json"

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-${{ inputs.build_id }}-build
