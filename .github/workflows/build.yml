# Cloud's builder: turns one commit of an App repo into an image on ghcr.
# Cloud dispatches it (src/reconciler/github.ts in the cloud repo) and reads
# the run back; nothing else starts it.
#
# Job `fetch` checks out exactly `sha` and uploads the tree without .git.
# It is the only job that may see a repository token, and only its fetch
# step does. Job `build` gets the tree, builds it with the repo's Dockerfile
# or Railpack, and pushes `image:sha` with this repo's GITHUB_TOKEN, which
# it signs in with only after Railpack has read the tree. It has no
# repository token, prints only the last 200 lines of each build step and
# uploads nothing but the image.
#
# A failed run prints one `cloud-failure: <code>` line (and an annotation);
# Cloud reads it from the job log to tell the User what to do next.
name: build
run-name: build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Cloud's id for this build (a Deploy id)
        required: true
        type: string
      repo_url:
        description: The App repo's https clone URL
        required: true
        type: string
      sha:
        description: The full 40-character commit sha to build
        required: true
        type: string
      image:
        description: The ghcr repository Cloud chose, without a tag
        required: true
        type: string
      source:
        description: Which credential reads the repo
        required: true
        type: choice
        options:
          - public
          - forgejo
          - github-owner

permissions: {}

# One build per App image at a time; a newer push cancels the older run.
# Cloud names each App's image cloud-<project>_<app>, one per App.
concurrency:
  group: ${{ inputs.image }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    outputs:
      image: ${{ steps.validate.outputs.image }}
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Check the inputs
        id: validate
        env:
          INPUT_BUILD_ID: ${{ inputs.build_id }}
          INPUT_REPO_URL: ${{ inputs.repo_url }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_SOURCE: ${{ inputs.source }}
        run: |
          refuse() {
            echo "cloud-failure: invalid_input"
            echo "::error title=Cloud::$1"
            exit 1
          }
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$INPUT_BUILD_ID" =~ $uuid ]] || refuse "build_id is not a Cloud build id"
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || refuse "sha is not a full commit sha"
          image='^ghcr\.io/viktorbarzin/cloud-[a-z][a-z0-9-]{0,29}[a-z0-9]_[a-z][a-z0-9-]{0,29}[a-z0-9]$'
          [[ "$INPUT_IMAGE" =~ $image ]] || refuse "image is not one of Cloud's ghcr repositories"
          repo='^https://(([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63})/[A-Za-z0-9._~/-]+$'
          [[ "$INPUT_REPO_URL" =~ $repo ]] || refuse "repo_url is not a plain https clone URL"
          host="${BASH_REMATCH[1]}"
          case "$INPUT_SOURCE" in
            public) ;;
            forgejo)
              [ "$host" = "forgejo.viktorbarzin.me" ] || refuse "the Forgejo token is only sent to forgejo.viktorbarzin.me" ;;
            github-owner)
              [ "$host" = "github.com" ] || refuse "the owner token is only sent to github.com" ;;
            *) refuse "source is not public, forgejo or github-owner" ;;
          esac
          {
            echo "repo_url=$INPUT_REPO_URL"
            echo "repo_host=$host"
            echo "sha=$INPUT_SHA"
            echo "image=$INPUT_IMAGE"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the commit
        id: fetch
        env:
          REPO_URL: ${{ steps.validate.outputs.repo_url }}
          REPO_HOST: ${{ steps.validate.outputs.repo_host }}
          SHA: ${{ steps.validate.outputs.sha }}
          REPO_TOKEN: ${{ inputs.source == 'forgejo' && secrets.FORGEJO_READ_TOKEN || inputs.source == 'github-owner' && secrets.GH_OWNER_READ_TOKEN || '' }}
        run: |
          fail() {
            echo "cloud-failure: fetch_failed"
            echo "::error title=Cloud::$1"
            exit 1
          }
          # No system or user git config: the runner's turns on the Git LFS
          # filter, which would send the header below to any lfs.url the
          # repo's .lfsconfig names. The repo's tree runs no filter at all.
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null
          export GIT_LFS_SKIP_SMUDGE=1 GIT_TERMINAL_PROMPT=0
          # The token goes to git through the environment only: never into
          # a file, an argument or the remote URL. The header is scoped to
          # the repo's host, which the input check tied to the token.
          if [ -n "$REPO_TOKEN" ]; then
            basic=$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)
            echo "::add-mask::$basic"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.https://$REPO_HOST/.extraHeader"
            export GIT_CONFIG_VALUE_0="Authorization: Basic $basic"
          fi
          unset REPO_TOKEN
          git_safe=(git -c protocol.allow=never -c protocol.https.allow=always
            -c http.followRedirects=false -c credential.helper=
            -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false)
          git init -q tree
          cd tree
          if "${git_safe[@]}" fetch -q --depth 1 --no-tags -- "$REPO_URL" "$SHA"; then
            # Every object is here: the checkout needs no network, so no token.
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
          else
            # A server that refuses a sha in `want` still serves its branches.
            # The checkout then fetches blobs, with the host-scoped header.
            "${git_safe[@]}" fetch -q --no-tags --filter=blob:none -- "$REPO_URL" \
              '+refs/heads/*:refs/remotes/origin/*' || fail "the repo could not be read"
          fi
          "${git_safe[@]}" -c advice.detachedHead=false checkout -q --detach "$SHA" \
            || fail "commit $SHA is not in the repo"
          [ "$(git rev-parse HEAD)" = "$SHA" ] || fail "checked out the wrong commit"
          rm -rf .git
          cd ..
          tar -czf tree.tgz -C tree .
          echo "fetched $SHA"

      - name: Upload the tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tree-${{ inputs.build_id }}
          path: tree.tgz
          retention-days: 1
          if-no-files-found: error

  build:
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
    env:
      RAILPACK_VERSION: 0.43.0
      RAILPACK_SHA256: 248a8f60f36854aabed6124113631078a802de3461660855fc4de9c26065c1fb
      RAILPACK_FRONTEND: ghcr.io/railwayapp/railpack-frontend:v0.43.0@sha256:355ef61fae6f2551103cd8b10c710cb07167dd353d561f15c69b8d7ac1c676cc
    steps:
      - name: Download the tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tree-${{ inputs.build_id }}
          path: ${{ runner.temp }}/artifact

      - name: Unpack the tree
        run: |
          mkdir tree
          tar -xzf "$RUNNER_TEMP/artifact/tree.tgz" -C tree
          rm -rf "$RUNNER_TEMP/artifact"

      - name: Install Railpack
        run: |
          curl -fsSL -o "$RUNNER_TEMP/railpack.tgz" \
            "https://github.com/railwayapp/railpack/releases/download/v${RAILPACK_VERSION}/railpack-v${RAILPACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${RAILPACK_SHA256}  $RUNNER_TEMP/railpack.tgz" | sha256sum -c --quiet -
          tar -xzf "$RUNNER_TEMP/railpack.tgz" -C "$RUNNER_TEMP" railpack

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Before signing in: Railpack reads the User's tree on this host, so
      # it runs while no registry credential is on the runner. The plan goes
      # outside the tree, so a file the repo planted there is not followed.
      - name: Plan the build
        run: |
          set -uo pipefail
          if [ -f tree/Dockerfile ]; then
            echo "cloud: building with the repo's Dockerfile"
            exit 0
          fi
          echo "cloud: no Dockerfile, building with Railpack ${RAILPACK_VERSION}"
          log="$RUNNER_TEMP/prepare.log"
          status=0
          timeout --signal=TERM 3m "$RUNNER_TEMP/railpack" prepare tree \
            --plan-out "$RUNNER_TEMP/railpack-plan.json" > "$log" 2>&1 || status=$?
          tail -n 200 "$log"
          if [ "$status" -eq 0 ]; then
            rm -f "$log"
            exit 0
          fi
          if [ "$status" -eq 124 ]; then
            code=timed_out
          elif grep -q "could not determine how to build" "$log"; then
            code=no_build_plan
          else
            code=build_failed
          fi
          rm -f "$log"
          echo "cloud-failure: $code"
          echo "::error title=Cloud::the build failed ($code)"
          exit 1

      - name: Sign in to ghcr
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        env:
          IMAGE: ${{ needs.fetch.outputs.image }}
          SHA: ${{ needs.fetch.outputs.sha }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          tag="$IMAGE:$SHA"
          source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          args=(--progress plain --provenance=false --push --tag "$tag"
            --label "org.opencontainers.image.source=$source_url"
            --annotation "org.opencontainers.image.source=$source_url")
          if [ ! -f tree/Dockerfile ]; then
            args+=(--build-arg "BUILDKIT_SYNTAX=$RAILPACK_FRONTEND"
              -f "$RUNNER_TEMP/railpack-plan.json")
          fi
          status=0
          # Below the job's 20 minutes, so the log still says why.
          timeout --signal=TERM 15m docker buildx build "${args[@]}" tree \
            > "$log" 2>&1 || status=$?
          tail -n 200 "$log"
          rm -f "$log"
          if [ "$status" -eq 0 ]; then
            echo "cloud: pushed $tag"
            exit 0
          fi
          if [ "$status" -eq 124 ]; then
            code=timed_out
          else
            code=build_failed
          fi
          echo "cloud-failure: $code"
          echo "::error title=Cloud::the build failed ($code)"
          exit 1

      - name: Sign out of ghcr
        if: always()
        run: docker logout ghcr.io
